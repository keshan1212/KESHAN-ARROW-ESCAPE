
name: KESHAN ARROW APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cordova platform add android@14

      - name: Build APK
        run: npx cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KESHAN-ARROW-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
